[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.0"
description = "A stable, observable, extensible agent framework for learning"
requires-python = ">=3.12"
authors = [
    { name = "myagent" },
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["myagent*"]

[tool.pytest.ini_options]
markers = [
    "e2e: 走真实 LLM API 的端到端测试（慢、消耗 token），跳过用 -m 'not e2e'",
]
